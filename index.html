<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>華鴻文理補習班｜每日教養與學習筆記</title>
<meta name="description" content="華鴻文理補習班每日筆記：覺知教育、非認知能力、閱讀推薦、安親日常、兒童美語、升學軟實力。會讀書，也要會做人。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red:      #b8202e;
    --red-dk:   #8c1520;
    --gold:     #c9920a;
    --gold-lt:  #fdf0cc;
    --bg:       #f4f2ef;
    --paper:    #ffffff;
    --ink:      #1c1c1c;
    --ink2:     #484848;
    --ink3:     #909090;
    --line:     #e4e0d8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    font-family: 'Noto Serif TC', Georgia, serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.75;
    min-height: 100vh;
  }
  h1,h2,h3,.sans,.brand-name,.filter-btn,.stat-num,.topic-tag,.nav-cta {
    font-family: 'Noto Sans TC', Arial, sans-serif;
  }

  /* ── Header ── */
  .site-header {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 0 48px;
    height: 66px;
    position: sticky; top:0; z-index:100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    display: flex; align-items:center; justify-content:space-between;
  }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-mark {
    width:42px; height:42px;
    background: linear-gradient(135deg, var(--red) 0%, #7a1020 100%);
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:18px; color:#f5c842;
    box-shadow: 0 3px 10px rgba(184,32,46,0.3);
  }
  .brand-name { font-size:17px; font-weight:700; color:var(--ink); letter-spacing:1px; }
  .brand-sub  { font-size:10px; color:var(--ink3); letter-spacing:2.5px; margin-top:1px; }
  .nav-cta {
    background: linear-gradient(135deg, var(--red) 0%, #7a1020 100%);
    color:#fff;
    padding:9px 24px; border-radius:6px;
    font-size:13px; font-weight:700; text-decoration:none;
    box-shadow: 0 3px 10px rgba(184,32,46,0.25);
    transition: opacity .2s;
    letter-spacing:0.5px;
  }
  .nav-cta:hover { opacity:0.88; }

  /* ── Hero（v3：紙質米色 + 手繪風，降低紅色壓力）── */
  .hero {
    background:
      radial-gradient(ellipse 300px 200px at 78% 32%, rgba(120, 80, 50, 0.06) 0%, transparent 70%),
      linear-gradient(rgba(45, 42, 38, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45, 42, 38, 0.04) 1px, transparent 1px),
      #fbf6ee;
    background-size: auto, 22px 22px, 22px 22px, auto;
    padding: 48px 48px 44px;
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid rgba(45, 42, 38, 0.08);
  }
  /* hero ::before/::after 已併入 background；如要加咖啡漬可重啟 */
  .hero-inner {
    max-width:780px; margin:0 auto;
    position:relative; z-index:1;
  }
  .hero-eyebrow {
    display:inline-block;
    font-size:12px; font-weight:700;
    color:var(--red);
    letter-spacing:2.5px; text-transform:uppercase;
    margin-bottom:18px;
    background: rgba(247, 200, 75, 0.45);
    padding:4px 12px;
    border-radius: 14px 11px 13px 9px / 9px 13px 11px 14px;  /* 手繪不規則 */
    transform: rotate(-1.5deg);
  }
  .hero h1 {
    font-size:46px; font-weight:900; color:var(--ink);
    line-height:1.3; letter-spacing:2px;
    margin-bottom:18px;
  }
  /* 「讀書」用紅蠟筆圈起 */
  .hero h1 .accent-word {
    color:var(--red);
    position:relative;
    display:inline-block;
    padding:0 6px;
  }
  .hero h1 .accent-word::after {
    content:'';
    position:absolute; inset:-6px -10px;
    border:2.5px solid var(--red);
    border-radius: 50% 60% 40% 55% / 50% 45% 55% 50%;
    transform: rotate(-3deg);
    opacity:0.7;
    pointer-events:none;
  }
  /* 「做人」加螢光筆 highlight */
  .hero h1 .accent-mark {
    background: linear-gradient(180deg, transparent 55%, rgba(247, 200, 75, 0.55) 55%);
    padding: 0 4px;
  }
  .hero-sub {
    font-size:16.5px; color:var(--ink2);
    max-width:580px; line-height:1.9;
    margin-bottom:0;
  }
  /* 右上手繪箭頭裝飾（指向下方文章區） */
  .hero-doodle {
    position:absolute; right:60px; top:48px;
    width:90px; height:60px; opacity:0.55;
    pointer-events:none;
    transform: rotate(8deg);
  }
  @media (max-width:640px) { .hero-doodle { display:none; } }
  .hero-stats {
    display:flex; gap:0;
    background:rgba(0,0,0,0.2);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:12px;
    overflow:hidden;
    width:fit-content;
    backdrop-filter:blur(4px);
  }
  .stat-box {
    padding:16px 32px;
    border-right:1px solid rgba(255,255,255,0.1);
    text-align:center;
  }
  .stat-box:last-child { border-right:none; }
  .stat-num {
    font-size:28px; font-weight:800;
    color:#f5c842; line-height:1; margin-bottom:4px;
  }
  .stat-label {
    font-size:10px; color:rgba(255,255,255,0.5);
    letter-spacing:2.5px; font-weight:600;
  }

  /* ── Filter bar ── */
  .filter-wrap {
    background: var(--paper);
    border-bottom:1px solid var(--line);
    position:sticky; top:66px; z-index:90;
  }
  .filters {
    max-width:1160px; margin:0 auto;
    padding:14px 32px;
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .filter-btn {
    background:transparent;
    border:1.5px solid var(--line);
    padding:6px 18px; border-radius:999px;
    font-size:13px; cursor:pointer;
    color:var(--ink2); font-weight:500;
    transition:all .15s;
    white-space:nowrap;
  }
  .filter-btn:hover { border-color:var(--red); color:var(--red); }
  .filter-btn.active {
    background:linear-gradient(135deg, var(--red) 0%, #9e1a28 100%);
    color:#fff; border-color:var(--red);
    font-weight:700;
    box-shadow:0 2px 8px rgba(184,32,46,0.3);
  }

  /* ── Grid ── */
  .articles {
    max-width:1160px; margin:0 auto;
    padding:40px 32px 80px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(340px, 1fr));
    gap:22px;
  }

  /* ── Card ── */
  .card {
    background:var(--paper);
    border-radius:12px;
    border:1px solid var(--line);
    overflow:hidden;
    text-decoration:none; color:inherit;
    display:flex; flex-direction:column;
    transition:transform .2s, box-shadow .2s;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
  }
  .card:hover {
    transform:translateY(-4px);
    box-shadow:0 12px 32px rgba(0,0,0,0.12);
    border-color:#d0cbc4;
  }
  .card-stripe {
    height:4px;
    background:linear-gradient(90deg, var(--red), var(--gold));
    flex-shrink:0;
  }
  .card[data-axis="01"] .card-stripe,
  .card[data-axis="02"] .card-stripe,
  .card[data-axis="12"] .card-stripe {
    background:linear-gradient(90deg, #8c1520, #b8202e);
  }
  .card[data-axis="03"] .card-stripe,
  .card[data-axis="09"] .card-stripe {
    background:linear-gradient(90deg, #2d6a4f, #52b788);
  }
  .card[data-axis="04"] .card-stripe,
  .card[data-axis="07"] .card-stripe {
    background:linear-gradient(90deg, #c9920a, #f4c430);
  }
  .card[data-axis="05"] .card-stripe {
    background:linear-gradient(90deg, #1a5276, #2e86c1);
  }
  .card[data-axis="06"] .card-stripe,
  .card[data-axis="10"] .card-stripe {
    background:linear-gradient(90deg, #6c3483, #9b59b6);
  }
  .card[data-axis="08"] .card-stripe,
  .card[data-axis="13"] .card-stripe {
    background:linear-gradient(90deg, #a04000, #e67e22);
  }
  .card[data-axis="11"] .card-stripe {
    background:linear-gradient(90deg, #1a7a6e, #1abc9c);
  }
  .card-body {
    padding:22px 24px 20px;
    display:flex; flex-direction:column;
    gap:10px; flex:1;
  }
  .card-meta {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .topic-tag {
    display:inline-block;
    padding:3px 10px; border-radius:4px;
    font-size:11px; font-weight:700;
    background:var(--gold-lt); color:var(--gold);
    letter-spacing:0.3px;
  }
  .card-date {
    font-size:12px; color:var(--ink3);
    font-family:'Noto Sans TC', sans-serif;
  }
  .card h3 {
    font-size:16px; font-weight:700;
    color:var(--ink); line-height:1.55;
  }
  .card-summary {
    font-size:13px; color:var(--ink2);
    line-height:1.75; flex:1;
  }
  .card-footer {
    margin-top:10px; padding-top:10px;
    border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .card-ta   { font-size:11px; color:var(--ink3); }
  .card-arrow {
    font-size:16px; color:var(--red);
    font-weight:700; opacity:0; transition:opacity .2s;
  }
  .card:hover .card-arrow { opacity:1; }

  /* ── Card 縮圖（Unsplash 教育主題照，按 axis 自動配圖）── */
  .card-thumb {
    width:100%; height:180px; display:block;
    object-fit:cover; object-position:center 38%;
    background:linear-gradient(135deg, #f0e6dd 0%, #e8dccc 100%);
    border-bottom:1px solid var(--line);
    transition:transform .35s;
  }
  .card:hover .card-thumb { transform:scale(1.04); }

  /* ── 入場動畫（hero → 書區 → filter → 卡片漸進淡入）── */
  @keyframes wnFadeUp {
    from { opacity:0; transform:translateY(28px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes wnFadeDown {
    from { opacity:0; transform:translateY(-18px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .site-header { animation: wnFadeDown 0.5s ease-out both; }
  .hero { animation: wnFadeDown 0.7s 0.1s ease-out both; }
  .books-section { animation: wnFadeUp 0.6s 0.3s ease-out both; }
  .filter-wrap { animation: wnFadeUp 0.5s 0.45s ease-out both; }
  .card {
    opacity:0;
    animation: wnFadeUp 0.55s ease-out forwards;
    /* animation-delay 由 JS 依卡片順序設定 */
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration:0.01ms !important;
      animation-delay:0ms !important;
      transition-duration:0.01ms !important;
    }
  }

  /* ── Empty ── */
  .empty {
    text-align:center; padding:60px 24px;
    color:var(--ink3); grid-column:1/-1; font-size:15px;
  }

  /* ── Footer ── */
  .site-footer {
    background:linear-gradient(135deg, #1a0a0c 0%, #2d1015 100%);
    color:#fff;
    padding:52px 32px 36px;
    text-align:center;
    position:relative; overflow:hidden;
  }
  .site-footer::before {
    content:'';
    position:absolute; top:0; left:0; right:0;
    height:3px;
    background:linear-gradient(90deg, var(--red), var(--gold), var(--red));
  }
  .footer-brand {
    font-size:18px; font-weight:800; color:#fff;
    letter-spacing:2px; margin-bottom:8px;
  }
  .footer-brand span { color:#f5c842; }
  .footer-tagline {
    font-size:13px; color:rgba(255,255,255,0.5);
    margin-bottom:14px; letter-spacing:1px;
  }
  .footer-divider {
    width:48px; height:2px;
    background:linear-gradient(90deg, var(--red), var(--gold));
    margin:0 auto 24px; border-radius:1px;
  }
  .footer-info {
    font-size:12px; color:rgba(255,255,255,0.4);
    line-height:2;
  }
  .footer-info a { color:rgba(255,255,255,0.6); text-decoration:none; }
  .footer-info a:hover { color:#f5c842; }

  @media (max-width:640px) {
    .site-header { padding:0 18px; }
    .hero { padding:52px 20px 44px; }
    .hero h1 { font-size:30px; }
    .hero-stats { flex-direction:column; width:100%; }
    .stat-box { border-right:none; border-bottom:1px solid rgba(255,255,255,0.1); }
    .stat-box:last-child { border-bottom:none; }
    .filter-wrap { top:66px; }
    .filters { padding:10px 16px; }
    .articles { padding:28px 16px 56px; gap:16px; }
  }

  /* ── Books Section ── */
  .books-section {
    background: var(--gold-lt);
    border-top: 1px solid #e8d99a;
    border-bottom: 1px solid #e8d99a;
    padding: 14px 48px;
  }
  .books-inner {
    max-width:1160px; margin:0 auto;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .books-label {
    font-size:10px; font-weight:700; letter-spacing:2px;
    color:var(--gold); text-transform:uppercase;
    font-family:'Noto Sans TC', sans-serif;
    white-space:nowrap; flex-shrink:0;
  }
  .books-divider {
    width:1px; height:32px; background:#d4b96a; flex-shrink:0;
  }
  .books-list {
    display:flex; gap:12px; flex:1; flex-wrap:wrap;
  }
  .book-item {
    display:flex; align-items:center; gap:10px;
    background:var(--paper);
    border:1px solid #e0d0a0;
    border-radius:8px;
    padding:8px 14px;
    min-width:0; flex:1;
    text-decoration:none; color:inherit; cursor:pointer;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .book-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(184,32,46,0.12);
    border-color: var(--brand, #b8202e);
  }
  .book-num {
    flex-shrink:0;
    width:28px; height:28px;
    background: linear-gradient(135deg, var(--red-dk), var(--red));
    border-radius:5px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Sans TC', sans-serif;
    font-size:11px; font-weight:900; color:#f5c842;
  }
  .book-info { min-width:0; }
  .book-badge {
    font-size:9px; font-weight:700; color:var(--gold);
    font-family:'Noto Sans TC', sans-serif;
    letter-spacing:0.5px; margin-bottom:1px;
  }
  .book-title {
    font-size:13px; font-weight:700; color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .book-vol {
    font-size:11px; color:var(--ink3);
    font-family:'Noto Sans TC', sans-serif;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* ── Books Section ── */
  .books-section {
    background: var(--paper);
    border-top: 1px solid var(--line);
    padding: 60px 48px;
  }
  .books-inner { max-width:1160px; margin:0 auto; }
  .books-header { text-align:center; margin-bottom:40px; }
  .books-eyebrow {
    display:inline-block;
    font-size:10px; font-weight:700; letter-spacing:3px;
    color:var(--gold); text-transform:uppercase;
    background:var(--gold-lt); padding:4px 14px; border-radius:999px;
    margin-bottom:12px;
  }
  .books-title { font-size:26px; font-weight:800; color:var(--ink); margin-bottom:10px; }
  .books-sub { font-size:12px; color:var(--ink3); max-width:500px; margin:0 auto; }
  .books-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:18px;
  }
  .book-card {
    display:flex; align-items:flex-start; gap:16px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    text-decoration:none; color:inherit;
    transition:transform .2s, box-shadow .2s, border-color .2s;
  }
  .book-card:hover {
    transform:translateY(-3px);
    box-shadow:0 8px 24px rgba(0,0,0,0.1);
    border-color:var(--gold);
  }
  .book-icon {
    font-size:36px;
    flex-shrink:0;
    width:52px; height:52px;
    background:var(--gold-lt);
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
  }
  .book-info { flex:1; min-width:0; }
  .book-badge {
    display:inline-block;
    font-size:10px; font-weight:700; letter-spacing:1px;
    color:var(--red); background:rgba(184,32,46,0.08);
    padding:2px 8px; border-radius:999px;
    margin-bottom:6px;
    font-family:'Noto Sans TC', sans-serif;
  }
  .book-title {
    font-size:15px; font-weight:700; color:var(--ink);
    margin-bottom:2px; line-height:1.4;
    font-family:'Noto Sans TC', sans-serif;
  }
  .book-author { font-size:12px; color:var(--ink3); margin-bottom:6px; }
  .book-desc { font-size:13px; color:var(--ink2); line-height:1.6; }
</style>
</head>
<body>

<header class="site-header">
  <div class="brand">
    <div class="brand-mark">華</div>
    <div>
      <div class="brand-name">華鴻文理補習班</div>
      <div class="brand-sub">Daily · Learning · Care</div>
    </div>
  </div>
  <a class="nav-cta" href="#articles">最新文章</a>
</header>

<section class="hero">
  <svg class="hero-doodle" viewBox="0 0 90 60" aria-hidden="true">
    <path d="M5 28 Q 22 12 42 25 T 78 18" stroke="#b8202e" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M70 10 L 82 18 L 74 28" stroke="#b8202e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
  <div class="hero-inner">
    <div class="hero-eyebrow">每日教學筆記</div>
    <h1>會<span class="accent-word">讀書</span>，也要會<span class="accent-mark">做人</span></h1>
    <p class="hero-sub">先有動機，再談成績——每天記下一件教室裡發生的小事，一個孩子的一句話、一個猶豫、一場討論。寫給願意慢下來陪孩子的你。</p>
  </div>
</section>


<!-- ── 推薦書區塊 ── -->
<section class="books-section">
  <div class="books-inner">
    <div class="books-label">本週推薦</div>
    <div class="books-divider"></div>
    <div class="books-list" id="books-grid"></div>
  </div>
</section>

<script>
// 每週輪播書單（7 週循環，所有書都附博客來商品頁連結，2026-05-17 全部對齊真實版本）
const bookSchedule = [
  // 第 1 週
  [
    { badge:"低年級最愛｜國小 1–3 年級", title:"怪傑佐羅力1：打敗噴火龍", vol:"系列第 1 集", meta:"原裕 著｜台灣東方出版", desc:"系列起點。狐狸佐羅力為了向天上的媽媽證明自己，踏上「惡作劇之王」的修練之旅，意外收了兩頭豬小弟當跟班。故事節奏快、笑點密集,是最容易讓孩子「一翻開就讀完」的第一冊。" },
    { badge:"國小高年級–國中", title:"奇蹟男孩 Wonder(暢銷十周年增訂版)", vol:"含朱利安外傳章節", meta:"R.J. Palacio 著｜親子天下", desc:"天生臉部異常的奧吉第一次踏入普通學校。故事以多視角輪流敘述,紐約時報暢銷榜連續 200 週,適合班級共讀與同理心討論。10 週年增訂版收錄霸凌者朱利安的外傳章節,可以一次讀正反兩面。" }
  ],

function getWeekNumber(d) {
  const date = new Date(d);
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() + 4 - (date.getDay() || 7));
  const yearStart = new Date(date.getFullYear(), 0, 1);
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}

const weekNum = getWeekNumber(new Date());
const weekIdx = (weekNum - 1) % bookSchedule.length;
const thisWeek = bookSchedule[weekIdx];

const grid = document.getElementById('books-grid');
thisWeek.forEach((b, i) => {
  const card = document.createElement('a');
  card.className = 'book-item';
  // 整張卡片連到博客來搜尋
  const q = encodeURIComponent(b.title);
  card.href = b.url || ('https://search.books.com.tw/search/query/key/' + q);
  card.target = '_blank';
  card.rel = 'noopener noreferrer';
  card.title = '在博客來搜尋《' + b.title + '》';
  card.innerHTML = `
    <div class="book-num">0${i+1}</div>

      <div class="book-badge">${b.badge}</div>
      <div class="book-title">${b.title}　${b.vol}</div>
      <div class="book-vol">${b.meta}</div>
    </div>
  `;
  grid.appendChild(card);
});

const filterMap = {
  parenting: ["01","12","13","14","15"],  // 14 SEL 介紹、15 4C 素養力歸入親子教養（品牌深耕）
  learning:  ["02","10","05"],
  reading:   ["03","09"],
  exam:      ["06","08","11"],
  daily:     ["04","07"],
};

const taLabels = {
  A: "找補習班的家長",
  B: "在班家長",
  C: "教養家長",
  D: "國小學童",
  E: "國中升學家長"
};

// ── 卡片縮圖：按 axis 對應 Unsplash 教育主題照片池（5 張/池，依日期循環）──
// 照片池沿用覺知網站 v3-edu 驗證過的 35 張 Unsplash photo（明亮、暖色、有人物，全部 200 OK verified）
// 不下載到本地，瀏覽器直接拉取（auto-format + w=800 自動瘦身，縮圖約 50-120KB）
const AXIS_PHOTO_POOLS = {
  "01": ["photo-1584697964038-28e16a2b6a3a","photo-1728455635901-bb16530faf40","photo-1584697964328-b1e7f63dca95","photo-1606295834251-36d654991797","photo-1596066190600-3af9aadaaea1"], // 覺知教育 → 青少年思考/書桌
  "02": ["photo-1560785496-3c9d27877182","photo-1514369118554-e20d93546b30","photo-1610484826625-ac2be7f1c8c1","photo-1565843248736-8c41e6db117b","photo-1585432959445-662c9bbcd91d"], // 非認知能力 → 學齡兒童寫作業
  "03": ["photo-1544463914-56f84a6cc6b1","photo-1725582205921-7d681ebca2a7","photo-1597098868667-113f3a729471","photo-1707219373528-35b242428adc","photo-1543556153-663aaf154a81"], // 閱讀推薦 → 閱讀/書桌/咖啡
  "06": ["photo-1584697964038-28e16a2b6a3a","photo-1606295834251-36d654991797","photo-1728455635901-bb16530faf40","photo-1596066190600-3af9aadaaea1","photo-1584697964328-b1e7f63dca95"], // 升學軟實力 → 青少年/書桌
  "07": ["photo-1584697964038-28e16a2b6a3a","photo-1728455635901-bb16530faf40","photo-1606295834251-36d654991797","photo-1596066190600-3af9aadaaea1","photo-1584697964328-b1e7f63dca95"], // 補習班幕後 → 青少年/教室
  "08": ["photo-1581952976147-5a2d15560349","photo-1576089073624-b5751a8f4de9","photo-1577896850561-dc005e5b5689","photo-1654613698275-b0930ef9570f","photo-1740679954195-a14d66b189ab"], // 家長焦慮 FAQ → 親子溝通
  "10": ["photo-1560785496-3c9d27877182","photo-1514369118554-e20d93546b30","photo-1610484826625-ac2be7f1c8c1","photo-1565843248736-8c41e6db117b","photo-1585432959445-662c9bbcd91d"], // 學習策略 → 學齡兒童寫作業
  "12": ["photo-1531984929664-2fb2be468d3e","photo-1560328055-e938bb2ed50a","photo-1624003652795-a9f73df756fa","photo-1537655780520-1e392ead81f2","photo-1564156280315-1d42b4651629"], // 正向教養 → 親子陪伴/共讀
  "14": ["photo-1581952976147-5a2d15560349","photo-1577896850561-dc005e5b5689","photo-1576089073624-b5751a8f4de9","photo-1654613698275-b0930ef9570f","photo-1531984929664-2fb2be468d3e"], // SEL 介紹 → 親子情感／溝通 + 幼兒安全感

};
const FALLBACK_POOL = AXIS_PHOTO_POOLS["01"];

// 全域去重照片分配 —— 整個首頁 10+ 篇不能有重複
// 演算法：照「日期最新先」排序逐篇分配。同 axis 池子用完 → 從所有池子借一張未用過的
const _allPoolSlugs = Array.from(new Set(Object.values(AXIS_PHOTO_POOLS).flat()));
function buildThumbAssignments(articles) {
  const used = new Set();
  const assignments = new Map();
  const sorted = [...articles].sort((a, b) => b.date.localeCompare(a.date));
  for (const a of sorted) {
    const pool = AXIS_PHOTO_POOLS[a.axis] || FALLBACK_POOL;
    // 1. 先從 axis pool 找未用過的（保持主題貼合）
    let slug = pool.find(s => !used.has(s));
    // 2. axis pool 全部撞了 → 從 35 張全集找未用過的
    if (!slug) slug = _allPoolSlugs.find(s => !used.has(s));
    // 3. 真的全用光（>35 篇）→ 重置 used，從頭再來
    if (!slug) { used.clear(); slug = pool[0]; }
    used.add(slug);
    assignments.set(a.file, slug);
  }
  return assignments;
}
const THUMB_ASSIGNMENTS = buildThumbAssignments(articles);

function thumbForArticle(article) {
  const slug = THUMB_ASSIGNMENTS.get(article.file)
            || (AXIS_PHOTO_POOLS[article.axis] || FALLBACK_POOL)[0];
  return `https://images.unsplash.com/${slug}?w=800&auto=format&fit=crop&q=80`;
}

function render(filter = "all") {
  const grid = document.getElementById("articles");
  grid.innerHTML = "";
  const axes = filterMap[filter];
  const list = filter === "all" ? articles : articles.filter(a => axes.includes(a.axis));
  if (list.length === 0) {
    grid.innerHTML = '<div class="empty">這個分類還沒有文章，請選其他分類或回到全部。</div>';
    return;
  }
  list.sort((a, b) => b.date.localeCompare(a.date));
  list.forEach((a, i) => {
    const card = document.createElement("a");
    card.className = "card";
    card.href = a.file;
    card.dataset.axis = a.axis;
    card.style.animationDelay = (0.5 + i * 0.06) + "s";
    const thumbUrl = thumbForArticle(a);
    // 首 4 張 eager（首屏立刻顯示），其餘 lazy 省頻寬
    const loadAttr = i < 4 ? "eager" : "lazy";
    card.innerHTML = `
      <img class="card-thumb" src="${thumbUrl}" alt="${a.title}" loading="${loadAttr}" decoding="async" onerror="this.style.display='none'">
      <div class="card-stripe"></div>
      <div class="card-body">
        <div class="card-meta">
          <span class="topic-tag">${a.axisLabel}</span>
          <span class="card-date">${a.date}</span>
        </div>
        <h3>${a.title}</h3>
        <div class="card-summary">${a.summary}</div>
        <div class="card-footer">
          <span class="card-ta">寫給 ${taLabels[a.ta] || ""}</span>
          <span class="card-arrow">→</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

render("all");

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render(btn.dataset.axis);
  });
});
</script>
